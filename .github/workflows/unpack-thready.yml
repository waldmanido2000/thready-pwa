name: Unpack Thready
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unpack-thready.yml']

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          unzip -q Thready-PWA.zip -d "$RUNNER_TEMP/thready"
          cp -a "$RUNNER_TEMP/thready/Thready-PWA/." .
          git rm Thready-PWA.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Thready PWA"
          git push
