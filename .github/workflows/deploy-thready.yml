name: Deploy Thready
on:
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: Cloudflare Account ID (32 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thready-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: worker
      - name: Deploy relay and prepare the PWA
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ inputs.cloudflare_account_id }}'
          THREADY_ADMIN_ID: '${{ secrets.THREADY_ADMIN_ID }}'
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo 'Add the CLOUDFLARE_API_TOKEN repository secret and provide a valid Cloudflare Account ID.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/subdomain';
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN };
          const current = await fetch(endpoint, {headers}).then(r => r.json());
          if (!current.success) {
            if (!current.errors?.some(error => error.code === 10007)) {
              throw new Error('Could not check the Workers subdomain: ' + JSON.stringify(current.errors));
            }
            const created = await fetch(endpoint, {
              method: 'PUT',
              headers: {...headers, 'Content-Type': 'application/json'},
              body: JSON.stringify({subdomain: 'thready-waldmanido2000'})
            }).then(r => r.json());
            if (!created.success) throw new Error('Could not register the Workers subdomain: ' + JSON.stringify(created.errors));
          }
          JS
          db_id() {
            npx wrangler d1 list --json | node --input-type=module -e 'const a = JSON.parse(await new Response(process.stdin).text()); process.stdout.write(a.find(x => x.name === "thready-delivery")?.uuid ?? "")'
          }
          D1_ID=$(db_id)
          if [[ -z "$D1_ID" ]]; then
            npx wrangler d1 create thready-delivery
            D1_ID=$(db_id)
          fi
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          export D1_ID
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const source = readFileSync('wrangler.toml', 'utf8');
          const config = source
            .replace(/^APP_ORIGIN = .*$/m, 'APP_ORIGIN = "https://waldmanido2000.github.io"')
            .replace(/^VAPID_SUBJECT = .*$/m, 'VAPID_SUBJECT = "https://waldmanido2000.github.io/thready-pwa/"')
            .replace(/^database_id = .*$/m, 'database_id = "' + process.env.D1_ID + '"');
          writeFileSync('.wrangler-deploy.toml', config);
          JS
          npx wrangler d1 migrations apply DB --remote --config .wrangler-deploy.toml
          npx wrangler deploy --config .wrangler-deploy.toml | tee "$RUNNER_TEMP/thready-deploy.log"
          if [[ -n "$THREADY_ADMIN_ID" ]]; then
            if [[ ! "$THREADY_ADMIN_ID" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
              echo 'THREADY_ADMIN_ID must be a full Thready ID.' >&2
              exit 1
            fi
            npx wrangler d1 execute DB --remote --config .wrangler-deploy.toml --command "INSERT INTO invitation_settings (singleton,admin_id) SELECT 1,id FROM accounts WHERE id='$THREADY_ADMIN_ID' AND deleted=0 ON CONFLICT(singleton) DO UPDATE SET admin_id=excluded.admin_id;"
            npx wrangler d1 execute DB --remote --config .wrangler-deploy.toml --json --command "SELECT COUNT(*) AS configured FROM invitation_settings WHERE singleton=1 AND admin_id='$THREADY_ADMIN_ID';" | node -e 'const result=JSON.parse(require("node:fs").readFileSync(0,"utf8")); if (result[0]?.results?.[0]?.configured !== 1) { console.error("The administrator must already have an active Thready account."); process.exit(1); }'
          fi
          WORKER_URL=$(grep -m1 -oE 'https://thready-delivery\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/thready-deploy.log")
          export WORKER_URL
          npx wrangler secret list --format json --config .wrangler-deploy.toml > "$RUNNER_TEMP/thready-secret-names.json"
          key_count=$(node -e 'const list = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(list.filter(x => ["VAPID_PUBLIC_KEY", "VAPID_PRIVATE_KEY"].includes(x.name)).length));' "$RUNNER_TEMP/thready-secret-names.json")
          if [[ "$key_count" == 0 ]]; then
            node -e 'const k = require("web-push").generateVAPIDKeys(); process.stdout.write(JSON.stringify({VAPID_PUBLIC_KEY:k.publicKey,VAPID_PRIVATE_KEY:k.privateKey}));' | npx wrangler secret bulk --config .wrangler-deploy.toml
          elif [[ "$key_count" != 2 ]]; then
            echo 'One Web Push key is missing. Restore the matching key in Cloudflare before redeploying.' >&2
            exit 1
          fi
          echo 'Waiting for the Worker HTTPS endpoint, including first-time certificate provisioning.'
          curl -fsS --retry 18 --retry-delay 10 --retry-max-time 185 --retry-all-errors --max-time 10 "$WORKER_URL/" -o "$RUNNER_TEMP/thready-health.json"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 "$WORKER_URL/push-key" -o "$RUNNER_TEMP/thready-push.json"
          node -e 'const fs = require("node:fs"); const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const push = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); if (health.service !== "Thready delivery" || typeof push.key !== "string" || !push.key) process.exit(1);' "$RUNNER_TEMP/thready-health.json" "$RUNNER_TEMP/thready-push.json"
          node -e 'require("node:fs").writeFileSync("../docs/config.js", "export const RELAY_URL = " + JSON.stringify(process.env.WORKER_URL) + ";\n");'
          npm run build:pwa
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: '${{ steps.pages.outputs.page_url }}'
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
